plugins { id 'com.android.application' }
layout.buildDirectory.set(file(providers.gradleProperty('codexBuildDir').getOrElse('../../.local/android-build/app')))
android {
    namespace 'dev.codexlan.remote'
    compileSdk 35
    defaultConfig {
        applicationId 'dev.codexlan.remote'
        minSdk 28
        targetSdk 35
        versionCode 28
        versionName '0.4.17-preview'
        ndk { abiFilters 'arm64-v8a' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        debug {
            storeFile file('../../.local/secrets/android-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    sourceSets.main.jniLibs.srcDirs = ['../../.local/native/easytier']
    packagingOptions { jniLibs { useLegacyPackaging = true } }
}
dependencies {
    implementation 'com.google.zxing:core:3.5.4'
    testImplementation 'junit:junit:4.13.2'
    // Android's JSON implementation preserves its null-to-"null" coercion;
    // JSON-java has different semantics and hid a real device regression.
    testImplementation 'com.vaadin.external.google:android-json:0.0.20131108.vaadin1'
}
