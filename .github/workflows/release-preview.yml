name: Desktop preview release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-preview.yml']
  workflow_dispatch:
concurrency:
  group: desktop-preview-release
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: npm
      - run: npm ci
      - name: Test
        shell: pwsh
        run: |
          $env:CODEX_LAN_TEST_KEYTOOL = Join-Path $env:JAVA_HOME_17_X64 'bin/keytool.exe'
          npm test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build clean desktop bundle
        shell: pwsh
        run: ./scripts/build-desktop-plugin.ps1
      - name: Check package privacy
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead((Join-Path $PWD '.local/releases/codex-lan-desktop-0.3.0-preview.zip'))
          try {
            $bad = @($zip.Entries | Where-Object { $_.FullName -match '(?i)(\.local/|\.local\.(json|md)|\.(keystore|pfx|pem|key|crt)$|Packet\.dll$)' })
            if ($bad.Count) { throw 'Unexpected private configuration or excluded dependency in release archive' }
          } finally { $zip.Dispose() }
      - name: Publish prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $asset = '.local/releases/codex-lan-desktop-0.3.0-preview.zip'
          $checksum = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content .local/releases/SHA256SUMS.txt "$checksum  codex-lan-desktop-0.3.0-preview.zip" -Encoding utf8
          gh release view v0.3.0-preview *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create v0.3.0-preview --target $env:GITHUB_SHA --prerelease --title 'Codex LAN Remote 0.3.0 Preview' --notes-file docs/release-0.3.0.md
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          gh release upload v0.3.0-preview $asset .local/releases/SHA256SUMS.txt --clobber
          exit $LASTEXITCODE

