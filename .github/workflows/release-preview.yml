name: Preview release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-preview.yml']
  workflow_dispatch:
  workflow_call:
concurrency:
  group: codex-lan-preview-release
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: npm
      - run: npm ci
      - name: Test
        shell: pwsh
        run: |
          $env:CODEX_LAN_TEST_KEYTOOL = Join-Path $env:JAVA_HOME_17_X64 'bin/keytool.exe'
          npm test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build clean desktop bundle
        shell: pwsh
        run: ./scripts/build-desktop-plugin.ps1
      - name: Fetch verified Android APK
        shell: pwsh
        run: |
          $apk = '.local/releases/codex-lan-0.3.3-preview.apk'
          Invoke-WebRequest 'https://raw.githubusercontent.com/fabulouszcc/codex-lan-remote/a3d4f249fb9d550ad0bd5c436805b5d78bd519ba/codex-lan-0.3.3-preview.apk' -OutFile $apk
          if ((Get-FileHash -LiteralPath $apk -Algorithm SHA256).Hash -ne '20EC5A0675071D7A3477D0DA1D89738B99DEC10B0C19E50996B37DC4847B8E97') { throw 'Android APK checksum mismatch' }
      - name: Check package privacy
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          foreach ($file in @('.local/releases/codex-lan-desktop-0.3.3-preview.zip', '.local/releases/codex-lan-0.3.3-preview.apk')) {
            $zip = [IO.Compression.ZipFile]::OpenRead((Join-Path $PWD $file))
            try {
              $bad = @($zip.Entries | Where-Object { $_.FullName -match '(?i)(\.local/|\.local\.(json|md)|shared_prefs/|databases/|\.(keystore|pfx|pem|key|crt)$|Packet\.dll$)' })
              if ($bad.Count) { throw 'Unexpected private file or excluded dependency in package' }
            } finally { $zip.Dispose() }
          }
      - name: Publish both installation packages
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CODEX_LAN_RELEASE_TAG: v0.3.3-preview
        run: |
          gh release view v0.3.3-preview *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create v0.3.3-preview --target $env:GITHUB_SHA --prerelease --title 'Codex LAN Remote 0.3.3 Preview' --notes-file docs/release-0.3.3.md
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          gh release upload v0.3.3-preview .local/releases/codex-lan-desktop-0.3.3-preview.zip .local/releases/codex-lan-0.3.3-preview.apk --clobber
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/update-release-notes.mjs
          exit $LASTEXITCODE
